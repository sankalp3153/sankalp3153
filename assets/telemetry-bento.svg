<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 175" width="100%" height="175">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Frame -->
  <rect width="880" height="175" rx="12" fill="#0D1015" stroke="#222834" stroke-width="1.5"/>

  <!-- Vertical Dividers -->
  <line x1="220" y1="0" x2="220" y2="175" stroke="#1E2430" stroke-width="1"/>
  <line x1="440" y1="0" x2="440" y2="175" stroke="#1E2430" stroke-width="1"/>
  <line x1="660" y1="0" x2="660" y2="175" stroke="#1E2430" stroke-width="1"/>

  <!-- Cell 01 -->
  <g transform="translate(22, 24)">
    <text x="0" y="12" class="mono" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.2">01 // BACKEND &amp; APIS</text>
    <text x="0" y="56" class="sans" font-size="30" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Py · Node</text>
    <text x="0" y="80" class="mono" font-size="11" fill="#22C55E">● REST, Webhooks &amp; Workers</text>
    <rect x="0" y="102" width="176" height="6" rx="3" fill="#1A202C"/>
    <rect x="0" y="102" width="164" height="6" rx="3" fill="#22C55E"/>
    <text x="0" y="126" class="mono" font-size="10" fill="#8B95A5">Django · FastAPI · Flask · Express</text>
  </g>

  <!-- Cell 02 -->
  <g transform="translate(242, 24)">
    <text x="0" y="12" class="mono" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.2">02 // EVENT STREAMING</text>
    <text x="0" y="56" class="sans" font-size="30" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Kafka · MQ</text>
    <text x="0" y="80" class="mono" font-size="11" fill="#F59E0B">● Distributed event brokers</text>
    <rect x="0" y="102" width="176" height="6" rx="3" fill="#1A202C"/>
    <rect x="0" y="102" width="156" height="6" rx="3" fill="#F59E0B"/>
    <text x="0" y="126" class="mono" font-size="10" fill="#8B95A5">Pub/Sub · DLQ · Rate Limiting</text>
  </g>

  <!-- Cell 03 -->
  <g transform="translate(462, 24)">
    <text x="0" y="12" class="mono" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.2">03 // DATA &amp; STORAGE</text>
    <text x="0" y="56" class="sans" font-size="30" font-weight="800" fill="#F8FAFC" letter-spacing="-1">PG · Redis</text>
    <text x="0" y="80" class="mono" font-size="11" fill="#38BDF8">● ACID ledgers &amp; caching</text>
    <rect x="0" y="102" width="176" height="6" rx="3" fill="#1A202C"/>
    <rect x="0" y="102" width="158" height="6" rx="3" fill="#38BDF8"/>
    <text x="0" y="126" class="mono" font-size="10" fill="#8B95A5">PostgreSQL · MySQL · MongoDB</text>
  </g>

  <!-- Cell 04 -->
  <g transform="translate(682, 24)">
    <text x="0" y="12" class="mono" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.2">04 // CLOUD &amp; DEVOPS</text>
    <text x="0" y="56" class="sans" font-size="30" font-weight="800" fill="#F8FAFC" letter-spacing="-1">K8s · AWS</text>
    <text x="0" y="80" class="mono" font-size="11" fill="#A855F7">● Container orchestration</text>
    <rect x="0" y="102" width="176" height="6" rx="3" fill="#1A202C"/>
    <rect x="0" y="102" width="160" height="6" rx="3" fill="#A855F7"/>
    <text x="0" y="126" class="mono" font-size="10" fill="#8B95A5">Docker · GitHub Actions · Nginx</text>
  </g>
</svg>
