<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="50%" stop-color="#11151C"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#15803D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E2430" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 4; }
      50% { opacity: 0.35; r: 6; }
    }
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    .pulse-dot { animation: pulse 2.2s infinite ease-in-out; }
    .spark-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <!-- Outer Card -->
  <rect width="880" height="260" rx="14" fill="url(#bgGrad)" stroke="#222834" stroke-width="1.5"/>
  <rect width="880" height="260" rx="14" fill="url(#grid)"/>

  <!-- Top Accent Line -->
  <rect x="120" y="0" width="640" height="2" fill="url(#emeraldGlow)"/>

  <!-- Window Header Bar -->
  <rect x="1" y="1" width="878" height="38" rx="13" fill="#12161E" fill-opacity="0.9"/>
  <line x1="0" y1="39" x2="880" y2="39" stroke="#222834" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="42" cy="20" r="5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="60" cy="20" r="5" fill="#22C55E" fill-opacity="0.8"/>

  <text x="86" y="24" class="mono" font-size="11" fill="#8B95A5" letter-spacing="0.8">sankalp@lemin-ai ~ // backend-kafka-cluster:prod</text>

  <!-- Live Status Pill -->
  <rect x="708" y="10" width="152" height="20" rx="10" fill="#15803D" fill-opacity="0.18" stroke="#22C55E" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="722" cy="20" r="4" fill="#22C55E" class="pulse-dot"/>
  <text x="734" y="24" class="mono" font-size="10" font-weight="600" fill="#4ADE80" letter-spacing="0.8">CLUSTER ONLINE</text>

  <!-- Main Identity Left Column -->
  <text x="36" y="74" class="mono" font-size="11" font-weight="600" fill="#22C55E" letter-spacing="1.8">BACKEND &amp; DISTRIBUTED SYSTEMS ENGINEER</text>
  <text x="36" y="114" class="sans" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">Sankalp Dev</text>
  <text x="36" y="140" class="sans" font-size="14" font-weight="500" fill="#94A3B8">Architecting Event-Driven CPaaS Backends, Kafka Pipelines &amp; APIs @ <tspan fill="#E2E8F0" font-weight="700">Lemin AI</tspan></text>
  <text x="36" y="162" class="sans" font-size="13" fill="#64748B">Ex-Co-Founder @ <tspan fill="#94A3B8" font-weight="600">Coders Crux</tspan>  ·  Microservices, Apache Kafka, Redis, PostgreSQL &amp; Kubernetes</text>

  <!-- Architecture Tags -->
  <g transform="translate(36, 184)">
    <rect x="0" y="0" width="136" height="26" rx="6" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="14" y="17" class="mono" font-size="11" fill="#E2E8F0">📡 Apache Kafka</text>

    <rect x="146" y="0" width="148" height="26" rx="6" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="160" y="17" class="mono" font-size="11" fill="#E2E8F0">⚙️ Python &amp; Node.js</text>

    <rect x="304" y="0" width="142" height="26" rx="6" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="318" y="17" class="mono" font-size="11" fill="#E2E8F0">🗄️ Postgres &amp; Redis</text>

    <rect x="456" y="0" width="132" height="26" rx="6" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="470" y="17" class="mono" font-size="11" fill="#E2E8F0">☸️ K8s · AWS · CI</text>
  </g>

  <!-- Right Column: Live Terminal / Telemetry Readout Box -->
  <g transform="translate(612, 58)">
    <rect x="0" y="0" width="236" height="152" rx="10" fill="#0D1016" stroke="#222834" stroke-width="1"/>
    <text x="16" y="24" class="mono" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">BACKEND // TELEMETRY</text>
    <line x1="0" y1="34" x2="236" y2="34" stroke="#1E232D" stroke-width="1"/>

    <text x="16" y="56" class="mono" font-size="11" fill="#8B95A5">Commits (25-26)</text>
    <text x="158" y="56" class="mono" font-size="12" font-weight="700" fill="#4ADE80">2,410+</text>

    <text x="16" y="80" class="mono" font-size="11" fill="#8B95A5">API p99 Latency</text>
    <text x="158" y="80" class="mono" font-size="12" font-weight="700" fill="#F1F5F9">&lt; 14.2ms</text>

    <text x="16" y="104" class="mono" font-size="11" fill="#8B95A5">Queue Throughput</text>
    <text x="158" y="104" class="mono" font-size="12" font-weight="700" fill="#38BDF8">50k/sec</text>

    <text x="16" y="128" class="mono" font-size="11" fill="#8B95A5">Production SLA</text>
    <text x="158" y="128" class="mono" font-size="12" font-weight="700" fill="#F59E0B">99.98%</text>
  </g>

  <!-- Bottom Telemetry Wave -->
  <path d="M 0 245 Q 110 232, 220 240 T 440 230 T 660 238 T 880 226 L 880 260 L 0 260 Z" fill="url(#areaFill)"/>
  <path d="M 0 245 Q 110 232, 220 240 T 440 230 T 660 238 T 880 226" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.7" class="spark-path"/>
</svg>
