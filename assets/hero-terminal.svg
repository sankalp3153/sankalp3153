<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="50%" stop-color="#11151C"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#15803D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E2430" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .pulse-dot { animation: pulse 2.4s infinite ease-in-out; }
  </style>

  <!-- Outer Frame -->
  <rect width="880" height="240" rx="12" fill="url(#bgGrad)" stroke="#222834" stroke-width="1.2"/>
  <rect width="880" height="240" rx="12" fill="url(#grid)"/>
  <rect x="140" y="0" width="600" height="1.5" fill="url(#accentLine)"/>

  <!-- Top Bar -->
  <rect x="1" y="1" width="878" height="34" rx="11" fill="#12161E" fill-opacity="0.9"/>
  <line x1="0" y1="35" x2="880" y2="35" stroke="#222834" stroke-width="1"/>
  <circle cx="22" cy="18" r="4.5" fill="#334155"/>
  <circle cx="38" cy="18" r="4.5" fill="#334155"/>
  <circle cx="54" cy="18" r="4.5" fill="#334155"/>
  <text x="76" y="22" class="mono" font-size="11" fill="#8B95A5">sankalp@lemin-ai:~/systems</text>

  <!-- Right Status -->
  <circle cx="754" cy="18" r="3.5" fill="#22C55E" class="pulse-dot"/>
  <text x="765" y="22" class="mono" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.8">OPEN TO COLLAB</text>

  <!-- Left Identity -->
  <text x="36" y="72" class="mono" font-size="11" font-weight="600" fill="#22C55E" letter-spacing="1.4">SOFTWARE ENGINEER // BACKEND &amp; INFRASTRUCTURE</text>
  <text x="36" y="110" class="sans" font-size="32" font-weight="700" fill="#F8FAFC" letter-spacing="-0.6">Sankalp Dev</text>
  <text x="36" y="136" class="sans" font-size="14" fill="#94A3B8">Building event-driven CPaaS backends &amp; cloud infrastructure @ <tspan fill="#F1F5F9" font-weight="600">Lemin AI</tspan></text>
  <text x="36" y="158" class="sans" font-size="13" fill="#64748B">Ex-Co-Founder @ <tspan fill="#94A3B8" font-weight="600">Coders Crux</tspan>  ·  India (UTC+05:30)</text>

  <!-- Focus Tags -->
  <g transform="translate(36, 180)">
    <rect x="0" y="0" width="118" height="24" rx="5" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="12" y="16" class="mono" font-size="10.5" fill="#CBD5E1">Python / Node</text>

    <rect x="128" y="0" width="122" height="24" rx="5" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="140" y="16" class="mono" font-size="10.5" fill="#CBD5E1">Apache Kafka</text>

    <rect x="260" y="0" width="132" height="24" rx="5" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="272" y="16" class="mono" font-size="10.5" fill="#CBD5E1">Postgres &amp; Redis</text>

    <rect x="402" y="0" width="142" height="24" rx="5" fill="#161B24" stroke="#262E3D" stroke-width="1"/>
    <text x="414" y="16" class="mono" font-size="10.5" fill="#CBD5E1">Docker · K8s · AWS</text>
  </g>

  <!-- Right Side: Honest Runtime Spec -->
  <g transform="translate(614, 54)">
    <rect x="0" y="0" width="234" height="154" rx="8" fill="#0D1016" stroke="#222834" stroke-width="1"/>
    <text x="16" y="24" class="mono" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">SYSTEMS // PROFILE</text>
    <line x1="0" y1="34" x2="234" y2="34" stroke="#1E232D" stroke-width="1"/>

    <text x="16" y="56" class="mono" font-size="11" fill="#64748B">domain</text>
    <text x="92" y="56" class="mono" font-size="11" fill="#F1F5F9">RCS &amp; WABA CPaaS</text>

    <text x="16" y="80" class="mono" font-size="11" fill="#64748B">runtime</text>
    <text x="92" y="80" class="mono" font-size="11" fill="#4ADE80">Python · Node.js</text>

    <text x="16" y="104" class="mono" font-size="11" fill="#64748B">brokers</text>
    <text x="92" y="104" class="mono" font-size="11" fill="#38BDF8">Kafka · Redis</text>

    <text x="16" y="128" class="mono" font-size="11" fill="#64748B">deploy</text>
    <text x="92" y="128" class="mono" font-size="11" fill="#E2E8F0">Docker · K8s · AWS</text>
